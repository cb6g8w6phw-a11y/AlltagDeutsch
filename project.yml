name: AlltagDeutsch
options:
  bundleIdPrefix: com.alltagdeutsch
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AlltagDeutsch:
    type: application
    platform: iOS
    sources:
      - path: AlltagDeutsch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alltagdeutsch.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: AlltagDeutsch
        GEMINI_API_KEY: "$(GEMINI_API_KEY)"
    info:
      path: AlltagDeutsch/Info.plist
      properties:
        CFBundleDisplayName: AlltagDeutsch
        UILaunchScreen: {}
        GEMINI_API_KEY: "$(GEMINI_API_KEY)"
